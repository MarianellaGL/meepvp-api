name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tablescore_test
          POSTGRES_USER: tablescore
          POSTGRES_PASSWORD: tablescore
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tablescore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tablescore:tablescore@localhost:5432/tablescore_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - run: test -z "$(gofmt -l auth config handlers internal mailer middleware migrations models services ws cmd)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
      - run: go build ./cmd/server ./cmd/cli

  publish:
    name: Publish Docker Hub image
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    concurrency:
      group: dockerhub-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_IMAGE DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in repository Actions configuration"
              exit 1
            fi
          done
          if [[ ! "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo "::error::DOCKERHUB_IMAGE must be a lowercase namespace/repository without a tag"
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
