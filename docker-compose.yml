services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tablescore
      POSTGRES_USER: tablescore
      POSTGRES_PASSWORD: tablescore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablescore -d tablescore"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - tablescore-postgres:/var/lib/postgresql/data

volumes:
  tablescore-postgres:
